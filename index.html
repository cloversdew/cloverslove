<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dylan</title>
<link rel="icon" href="/favicon.ico" sizes="16x16">
<meta name="description" content="dylan, cybersecurity student in pennsylvania. what i'm listening to and working on.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<div class="top">
  <header class="nav">
    <h1 class="nav-name" id="name">dylan</h1>
    <nav class="nav-links" aria-label="more about dylan">
      <button type="button" class="nav-btn" aria-expanded="false" aria-controls="p-recent">recent</button>
      <button type="button" class="nav-btn" aria-expanded="false" aria-controls="p-activity">activity</button>
      <button type="button" class="nav-btn" aria-expanded="false" aria-controls="p-repos">repos</button>
      <button type="button" class="nav-btn" aria-expanded="false" aria-controls="p-elsewhere">elsewhere</button>
    </nav>
    <div class="nav-meta">
      <p><time id="pa-time"></time> <span class="muted">in pa</span></p>
      <p class="status" id="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="muted">connecting</span></p>
    </div>
  </header>

  <div class="panels">
    <section class="panel p-recent" id="p-recent" aria-labelledby="h-recent" inert>
      <h2 class="lbl" id="h-recent">recently played</h2>
      <div class="body"><ol class="rows hist" id="hist"><li class="status-msg">loading the log…</li></ol></div>
    </section>

    <section class="panel p-activity" id="p-activity" aria-labelledby="h-act" inert>
      <h2 class="lbl" id="h-act">activity</h2>
      <div class="body">
        <div id="contrib"><p class="status-msg">loading contributions…</p></div>
        <p class="last" id="last"><span class="k">last worked on</span><span class="status-msg">loading…</span></p>
      </div>
    </section>

    <section class="panel p-repos" id="p-repos" aria-labelledby="h-repos" inert>
      <h2 class="lbl" id="h-repos">repos <span class="num" id="repo-count"></span></h2>
      <div class="body"><ul class="rows repos" id="repos"><li class="status-msg">loading repositories…</li></ul></div>
    </section>

    <section class="panel p-elsewhere" id="p-elsewhere" aria-labelledby="h-else" inert>
      <h2 class="lbl" id="h-else">elsewhere</h2>
      <ul class="rows socials" id="socials"></ul>
    </section>
  </div>
</div>

<main class="frame sheet">
  <section class="mod m-about" aria-labelledby="h-about">
    <h2 class="lbl" id="h-about">about <span class="sep">·</span> <span id="tagline"></span> <span class="sep">·</span> <span id="loc"></span></h2>
    <div class="bio" id="bio"></div>
  </section>

  <section class="mod m-now" aria-labelledby="h-now">
    <h2 class="lbl" id="h-now">now playing</h2>
    <div class="meta">
      <div class="discord" id="discord" aria-live="polite"><p class="status-msg">connecting to discord…</p></div>
      <div class="bday"><p class="muted" id="bday-label">next birthday in</p><time class="tick" id="bday"></time></div>
    </div>
    <div id="np"><p class="status-msg">checking spotify…</p></div>
  </section>
</main>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
